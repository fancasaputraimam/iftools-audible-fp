<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070A0F" />
    <title>iftools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============================================================
         iftools — Verdana Health Design System
         Calm, clinical, trustworthy. Navy + sage on soft white.
         ============================================================ */
      :root {
        /* ---- Color: dark console / terminal, neon-mint accent ---- */
        --navy: #0D141F;
        --navy-deep: #070B11;
        --slate: #647386;
        --sage: #00E5A0;
        --sage-soft: #16C98D;
        --bg: #070A0F;
        --surface: #0E141D;
        --surface-2: #141C27;
        --surface-3: #1E2835;
        --border: #1C2733;
        --border-soft: #131A24;
        --border-strong: #2E3B4B;
        --text: #D7E2EC;
        --text-2: #93A4B6;
        --text-3: #647386;
        --text-muted: #45525F;
        --success: #2BE88A;
        --success-rgb: 43, 232, 138;
        --success-deep: #4ADE80;
        --success-soft: rgba(43, 232, 138, 0.12);
        --warning: #FFC53D;
        --warning-rgb: 255, 197, 61;
        --warning-deep: #FACC15;
        --warning-soft: rgba(255, 197, 61, 0.12);
        --danger: #FF5C6C;
        --danger-rgb: 255, 92, 108;
        --danger-deep: #FF7B88;
        --danger-soft: rgba(255, 92, 108, 0.13);
        --info: #38BDF8;
        --info-rgb: 56, 189, 248;
        --info-soft: rgba(56, 189, 248, 0.13);

        /* ---- Elevation: gentle, diffused ---- */
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
        --shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
        --shadow-md: 0 4px 18px rgba(0, 0, 0, 0.55);
        --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.65);

        /* ---- Radius ---- */
        --r-sm: 4px;
        --r: 8px;
        --r-md: 12px;
        --r-lg: 16px;
        --r-full: 9999px;

        /* ---- Spacing (8px base) ---- */
        --sp-xs: 4px;
        --sp-sm: 8px;
        --sp-md: 16px;
        --sp-lg: 24px;
        --sp-xl: 32px;
        --sp-2xl: 48px;
        --sp-3xl: 64px;

        /* ---- Typography ---- */
        --font-head: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-body: 'DM Sans', ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-mono: 'Fira Code', ui-monospace, SFMono-Regular, Menlo,
          Monaco, Consolas, monospace;

        /* Focus rings (design system: focus = 2px navy + 3px soft ring) */
        --ring: 0 0 0 3px rgba(0, 229, 160, 0.25);
        --ring-danger: 0 0 0 3px rgba(255, 92, 108, 0.28);

        /* ---- Layout ---- */
        --page-max-width: 1280px;
        --bottom-nav-height: 64px;
        --sidebar-w: 252px;
        --sidebar-rail: 68px;

        /* ---- Legacy aliases (keep panel inline styles working) ---- */
        --bg-primary: var(--bg);
        --bg-secondary: var(--bg);
        --bg-card: var(--surface);
        --bg-card-hover: var(--surface-2);
        --bg-input: var(--surface);
        --color-void-black: var(--navy);
        --accent: var(--sage);
        --accent-rgb: 5, 150, 105;
        --accent-strong: #047857;
        --accent-text: var(--sage);
        --accent-soft: rgba(5, 150, 105, 0.10);
        --code-ident: var(--info);
        --ok: var(--success);
        --ok-rgb: var(--success-rgb);
        --muted: var(--text-3);
        --text-primary: var(--text);
        --text-secondary: var(--text-2);
        --glass: var(--surface);
        --glass-strong: var(--surface-2);
        --glass-border: var(--border);
        --radius-control: var(--r);
        --radius-card: var(--r-lg);
        --radius-panel: var(--r-lg);
        --color-smoke-gray: var(--border-strong);
        --color-alarm-red: var(--danger);
        --color-iris-violet: var(--info);
        --font-inter: var(--font-body);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-text-size-adjust: 100%; }
      html, body, #root { height: 100%; }

      body {
        background: var(--bg);
        color: var(--text-2);
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow: hidden;
      }

      /* Mobile scrolls the document; desktop scrolls inside .app-main. */
      @media (max-width: 820px) {
        body { overflow: auto; }
        html, body, #root { height: auto; min-height: 100%; }
      }

      h1, h2, h3, h4, h5, h6 { font-family: var(--font-head); color: var(--text); }
      ::selection { background: rgba(5, 150, 105, 0.21); }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 99px; border: 2px solid var(--bg); }
      ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }
      ::-webkit-scrollbar-track { background: transparent; }

      code, pre, kbd, samp { font-family: var(--font-mono); }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration:  0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
