<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Register</title>
    <style>
      :root {
        --bg-primary: #0B0F14;
        --bg-secondary: #0F141B;
        --bg-card: #111720;
        --bg-card-hover: #161D27;
        --bg-input: #0B0F14;
        --border: #26303D;
        --border-strong: #6366F1;
        --text-primary: #F1F5F9;
        --text-secondary: #94A3B8;
        --text-muted: #64748B;
        --text-disabled: #475569;
        --accent: #6366F1;
        --accent-rgb: 99, 102, 241;
        --accent-strong: #818CF8;
        --accent-text: #A5B4FC;
        --accent-2: #22D3EE;
        --accent-2-rgb: 34, 211, 238;
        --accent-soft: rgba(99, 102, 241, 0.14);
        --success: #34D399;
        --success-rgb: 52, 211, 153;
        --danger: #F87171;
        --danger-rgb: 248, 113, 113;
        --warning: #FBBF24;
        --info: #38BDF8;

        --bg: var(--bg-primary);
        --bg-raise: var(--bg-card);
        --text: var(--text-secondary);
        --ink: var(--text-primary);
        --muted: var(--text-muted);
        --ok: var(--success);
        --ok-rgb: var(--success-rgb);
        --glass-border: var(--border);
        --glass-highlight: rgba(148, 163, 184, 0.05);
        --glass: var(--bg-card);
        --glass-strong: var(--bg-card-hover);
        --ring: 0 0 0 3px rgba(99, 102, 241, 0.25);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      body {
        background: var(--bg-primary);
        color: var(--text-secondary);
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      @media (max-width: 820px) {
        body { overflow: auto; }
        html, body, #root { height: auto; min-height: 100%; }
      }
      ::selection { background: rgba(99, 102, 241, 0.32); }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: #26303D; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #475569; }
      ::-webkit-scrollbar-track { background: transparent; }
    </style>
  </head>
  <body>
    <div class="ambient"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
